version: '3.8'

services:
  nginx:
    container_name: nginx
    image: nginx:latest
    build: ./frontend
    depends_on:
      - api
    volumes:
      - /home/mdouzi/last/frontend/front/:/var/www/html/
    ports:
      - '443:443'
    networks:
      - network
    # restart: always

  api:
    container_name: api
    image: python:3.12-alpine
    build: ./backend
    depends_on:
      - postgres
    volumes:
      - /home/mdouzi/last/backend/api/:/app
    ports:
      - '8000:8000'
    networks:
      - network
    restart: always
    env_file:
      - /home/mdouzi/last/.env

  postgres:
    container_name: postgres
    image: postgres:latest
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - /home/mdouzi/last/postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - network
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9187:9187"  # Expose the PostgreSQL exporter on port 9187
    networks:
      - network
    depends_on:
      - postgres
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin  # Set Grafana admin password
    ports:
      - "3000:3000"
    networks:
      - network
    depends_on:
      - prometheus
    restart: always

networks:
  network: