services:
  nginx:
    container_name: nginx
    image: nginx:latest
    build: ./frontend
    depends_on:
      - api
    volumes:
    - /Users/eel-hour/ft_transcendence_mahdi/frontend/front/:/var/www/html/
    ports:
      - '443:443'
    networks:
      - network
    # restart: always
  api:
    container_name: api
    image: python:3.12-alpine
    build: ./backend
    depends_on:
      - postgres
    volumes:
      - /Users/eel-hour/ft_transcendence_mahdi/backend/api/:/app
    ports:
      - '8000:8000'
    networks:
      - network
    restart: always
    env_file:
      - /Users/eel-hour/ft_transcendence_mahdi/.env
  postgres:
    container_name: postgres
    image: postgres:latest
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - network
    restart: always

networks:
    network:

